<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#dbeafe"/>
      <stop offset="20%"  stop-color="#60a5fa"/>
      <stop offset="55%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#000117"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(37,99,235,0.45)" stroke-width="1.5"/>

  <!-- Inner glow -->
  <ellipse cx="32" cy="30" rx="22" ry="22" fill="rgba(37,99,235,0.1)"/>

  <g filter="url(#glow)">
    <!-- Left blade -->
    <path d="M17 14 L13 22 L13 42 L21 42 L21 22 Z" fill="url(#g)"/>
    <path d="M17 14 L13 22 L13 42 L15.2 42 L15.2 22 Z" fill="url(#sh)"/>

    <!-- Center blade (tallest) -->
    <path d="M32 7 L28 17 L28 42 L36 42 L36 17 Z" fill="url(#g)"/>
    <path d="M32 7 L28 17 L28 42 L30.2 42 L30.2 17 Z" fill="url(#sh)"/>

    <!-- Right blade -->
    <path d="M47 14 L43 22 L43 42 L51 42 L51 22 Z" fill="url(#g)"/>
    <path d="M47 14 L43 22 L43 42 L45.2 42 L45.2 22 Z" fill="url(#sh)"/>

    <!-- Crossbar -->
    <rect x="11" y="42" width="42" height="5" rx="2.5" fill="url(#g)"/>
    <rect x="11" y="42" width="42" height="2" rx="1" fill="rgba(255,255,255,0.2)"/>

    <!-- Shaft + binding -->
    <rect x="29" y="47" width="6" height="11" rx="2" fill="url(#g)"/>
    <rect x="23" y="54" width="18" height="4" rx="2" fill="url(#g)"/>
  </g>
</svg>
